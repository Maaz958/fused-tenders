# One-off history scan for the Renewals list.
# Reads past award notices (Find a Tender + Contracts Finder), newest month first, and saves contracts that
# end in the future to Supabase. Each run does up to ~5 hours, saves after every month, and the next run
# carries on where it stopped. Run it until the log says "Backfill already complete".
# The daily refresh then keeps the list up to date by itself.

name: Renewals backfill (one-off)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Newest month to scan (YYYY-MM). Leave blank to resume where the last run stopped."
        required: false
        default: ""
      stop:
        description: "Oldest month to scan (YYYY-MM)"
        required: false
        default: "2021-01"

permissions:
  contents: read

concurrency:
  group: tender-refresh          # never runs at the same time as the daily refresh (shared rate limits)
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan past award notices into Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          START: ${{ inputs.start }}
          STOP: ${{ inputs.stop }}
        run: |
          if [ -n "$START" ]; then
            python fetch_and_score.py --backfill-renewals --start "$START" --stop "${STOP:-2021-01}"
          else
            python fetch_and_score.py --backfill-renewals --stop "${STOP:-2021-01}"
          fi
