# FUSED Tender Intelligence - daily refresh
# Fetches and scores tenders, then publishes the dashboard to Cloudflare Pages
# (kept private by Cloudflare Access - only the emails you allow can open it).
#
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID publishing to Cloudflare Pages
#   SUPABASE_SERVICE_KEY                        saving / reading the renewals list

name: Daily tender refresh

on:
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC (05:17 GMT / 06:17 BST)
  workflow_dispatch:          # adds a "Run workflow" button for manual refreshes

permissions:
  contents: read

concurrency:
  group: tender-refresh
  cancel-in-progress: false

env:
  PAGES_PROJECT: fused-tenders   # becomes https://fused-tenders.pages.dev (Cloudflare adds a suffix if the name is taken)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345          # the script stops itself at 5 hours; GitHub's hard limit is 6

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Complete Public Contracts Scotland's certificate chain
        # Their server omits an intermediate certificate, so Python can't verify it. Fetch the missing
        # certificate from the official address listed inside their own certificate, add it to the
        # trusted bundle, and keep full verification on.
        continue-on-error: true
        run: |
          H=api.publiccontractsscotland.gov.uk
          echo | openssl s_client -connect $H:443 -servername $H 2>/dev/null | openssl x509 > /tmp/leaf.pem
          URL=$(openssl x509 -in /tmp/leaf.pem -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | sed 's/CA Issuers - URI://')
          echo "Issuer certificate: $URL"
          curl -sS --max-time 30 "$URL" -o /tmp/issuer.cer
          openssl x509 -inform DER -in /tmp/issuer.cer -out /tmp/issuer.pem 2>/dev/null || openssl x509 -in /tmp/issuer.cer -out /tmp/issuer.pem
          BUNDLE=$(python -c "import certifi; print(certifi.where())")
          cat "$BUNDLE" /tmp/issuer.pem > /tmp/ca-bundle.pem
          python -c "import requests; r=requests.get('https://$H/v1/Notices', timeout=60, verify='/tmp/ca-bundle.pem'); print('Scotland check:', r.status_code)"
          echo "REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"

      - name: Fetch, score and build dashboard
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # renewals (contracts ending soon)
        run: python fetch_and_score.py --days 45 --out site
        # If no data comes back, the script exits with an error and nothing is published,
        # so yesterday's dashboard stays live.

      - name: Create the Cloudflare Pages project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main || echo "Project already exists - carrying on"

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
